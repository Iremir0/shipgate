<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">shipgate</title>
  <desc id="d">A gated multi-agent delivery pipeline for Claude Code: To Do, In Progress, Code Review, Testing, Ready for Release.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14110f"/>
      <stop offset="1" stop-color="#2a1d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#f0b48f"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>

  <text x="80" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#d97757">/pipeline</text>
  <text x="80" y="192" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#f5efe9">shipgate</text>
  <text x="80" y="236" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#c9bdb3">Tickets in, reviewed and tested PRs out. Agents write the code; gates decide what ships.</text>

  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <g transform="translate(80 290)">
      <rect width="150" height="44" rx="22" fill="#2f2620" stroke="#5a4a40"/>
      <text x="75" y="28" text-anchor="middle" fill="#e8ddd4">To Do</text>
    </g>
    <path d="M238 312h28" stroke="#d97757" stroke-width="3"/>
    <g transform="translate(274 290)">
      <rect width="170" height="44" rx="22" fill="#2f2620" stroke="#5a4a40"/>
      <text x="85" y="28" text-anchor="middle" fill="#e8ddd4">In Progress</text>
    </g>
    <path d="M452 312h28" stroke="#d97757" stroke-width="3"/>
    <g transform="translate(488 290)">
      <rect width="180" height="44" rx="22" fill="#2f2620" stroke="#5a4a40"/>
      <text x="90" y="28" text-anchor="middle" fill="#e8ddd4">Code Review</text>
    </g>
    <path d="M676 312h28" stroke="#d97757" stroke-width="3"/>
    <g transform="translate(712 290)">
      <rect width="140" height="44" rx="22" fill="#2f2620" stroke="#5a4a40"/>
      <text x="70" y="28" text-anchor="middle" fill="#e8ddd4">Testing</text>
    </g>
    <path d="M860 312h28" stroke="#d97757" stroke-width="3"/>
    <g transform="translate(896 290)">
      <rect width="230" height="44" rx="22" fill="url(#accent)"/>
      <text x="115" y="28" text-anchor="middle" fill="#1b1410">Ready for Release</text>
    </g>
    <path d="M578 338c0 34 -218 34 -218 0" fill="none" stroke="#d97757" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="470" y="384" text-anchor="middle" font-size="13" font-weight="500" fill="#b9a89b">reject → same dev agent</text>
  </g>
</svg>
